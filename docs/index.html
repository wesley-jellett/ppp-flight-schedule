<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#14181F" />
<title>PPP Flight Board</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  :root {
    --bg: #14181F;
    --surface: #1C222B;
    --surface-2: #2A333F;
    --border: #2A313D;
    --text: #E7ECF2;
    --text-dim: #8B95A5;
    --teal: #3FBF9F;
    --amber: #F2A93B;
    --red: #E2584F;
    --cyan: #52C7E0;
    --divider: #3FBF9F;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    -webkit-tap-highlight-color: transparent;
    height: 100%;
  }

  body { display: flex; flex-direction: column; min-height: 100vh; }

  /* ── HEADER ── */
  header {
    position: sticky; top: 0; z-index: 20;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 0.75rem 1rem 0.6rem;
    flex-shrink: 0;
  }

  .header-row {
    display: flex; align-items: center;
    justify-content: space-between; gap: 0.5rem;
    flex-wrap: wrap;
  }

  h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.01em; white-space: nowrap; }
  h1 .code { font-family: var(--mono); color: var(--cyan); }

  .controls { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }

  .btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 0.4rem 0.75rem;
    font-size: 0.9rem;
    font-family: var(--sans);
    cursor: pointer;
    display: flex; align-items: center; gap: 0.4rem;
    white-space: nowrap;
  }
  .btn:active { background: var(--surface-2); }
  .btn.active { background: var(--cyan); color: #14181F; border-color: var(--cyan); font-weight: 700; }

  #toggleBtn {
    border-radius: 999px;
    padding: 0.7rem 1.6rem;
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    border-width: 2px;
    min-width: 160px;
    justify-content: center;
  }
  #toggleBtn.active {
    background: var(--cyan);
    color: #14181F;
    border-color: var(--cyan);
    box-shadow: 0 0 12px rgba(82,199,224,0.35);
  }

  .refresh-btn svg { width: 15px; height: 15px; }
  .refresh-btn.spinning svg { animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .meta {
    margin-top: 0.3rem;
    font-size: 0.78rem; color: var(--text-dim); font-family: var(--mono);
  }

  /* ── LEGEND ── */
  .legend {
    display: flex; gap: 0.9rem; flex-wrap: wrap;
    font-size: 0.72rem; color: var(--text-dim);
    padding: 0.5rem 1rem 0;
  }
  .legend span { display: flex; align-items: center; gap: 0.3rem; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.teal { background: var(--teal); }
  .dot.amber { background: var(--amber); }
  .dot.red { background: var(--red); }

  /* ── MAIN ── */
  main { flex: 1; padding: 0.75rem 1rem 2rem; }

  /* ── SECTION DIVIDER ── */
  .section-divider {
    display: flex; align-items: center; gap: 0.75rem;
    margin: 1.1rem 0 0.75rem;
  }
  .section-divider .label {
    font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--divider); white-space: nowrap;
  }
  .section-divider .line {
    flex: 1; height: 1px; background: var(--divider); opacity: 0.35;
  }

  /* ── TIMELINE BAR ── */
  .timeline-wrap {
    position: relative;
    margin-bottom: 1.25rem;
  }

  .timeline-bar {
    position: relative;
    height: 28px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    margin: 0 0 0.3rem;
    overflow: visible;
  }

  /* hour tick marks */
  .timeline-bar .tick {
    position: absolute;
    top: 0; bottom: 0;
    width: 1px;
    background: var(--border);
  }
  .tick-label {
    position: absolute;
    top: 30px;
    font-size: 0.62rem;
    color: var(--text-dim);
    font-family: var(--mono);
    transform: translateX(-50%);
  }

  /* flight pip on the bar */
  .bar-pip {
    position: absolute;
    top: 4px; bottom: 4px;
    width: 6px; border-radius: 3px;
    transform: translateX(-50%);
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .bar-pip.arr { background: var(--cyan); }
  .bar-pip.dep { background: var(--amber); }
  .bar-pip.at-risk { background: var(--red); }
  .bar-pip.hidden-flight { opacity: 0.2; }

  /* ── FLIGHT ROWS ── */
  .row {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    margin-bottom: 0.65rem;
    padding: 1rem 1.1rem;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 0.75rem;
    cursor: pointer;
    transition: opacity 0.2s, border-color 0.2s;
    user-select: none;
  }

  .row.at-risk {
    border-color: rgba(226, 88, 79, 0.55);
    background: linear-gradient(180deg, rgba(226, 88, 79, 0.08), var(--surface) 50%);
  }

  .row.selected {
    border-color: var(--cyan);
    box-shadow: 0 0 0 1px var(--cyan);
  }

  .row.hidden-flight {
    display: none;
  }

  /* ── LEG ── */
  .leg { min-width: 0; }
  .leg.departure { text-align: right; }

  .leg .place {
    font-size: 0.8rem; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.06em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .leg .flight {
    font-family: var(--mono);
    font-size: 1.55rem;        /* large — item 3 */
    color: var(--cyan);
    font-weight: 700;
    line-height: 1.1;
    margin: 0.1rem 0;
  }

  .leg .times {
    font-family: var(--mono);
    font-size: 1.2rem;         /* large — item 3 */
    color: var(--text);
    display: flex; gap: 0.4rem; align-items: baseline;
  }
  .leg.departure .times { justify-content: flex-end; }

  .times .sched.struck { text-decoration: line-through; color: var(--text-dim); }
  .times .est.delayed  { color: var(--amber); font-weight: 700; }
  .times .est.ontime   { color: var(--teal); }

  .leg .city {
    font-size: 1.05rem;        /* large city name — item 3 */
    font-weight: 600;
    color: var(--text);
    margin-top: 0.15rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .status-pill {
    display: inline-block; margin-top: 0.3rem;
    font-size: 0.72rem; padding: 0.12rem 0.5rem;
    border-radius: 5px; font-family: var(--sans);
  }
  .status-pill.delayed { background: rgba(242,169,59,0.15); color: var(--amber); }
  .status-pill.landed  { background: rgba(63,191,159,0.15); color: var(--teal); }

  /* ── CONNECTOR ── */
  .connector {
    display: flex; flex-direction: column; align-items: center;
    color: var(--text-dim); min-width: 36px;
  }
  .connector svg { width: 22px; height: 22px; }
  .row.at-risk .connector { color: var(--red); }
  .row.at-risk .connector svg { filter: drop-shadow(0 0 4px rgba(226,88,79,0.5)); }
  .risk-label { font-size: 0.6rem; color: var(--red); margin-top: 0.15rem; text-align: center; line-height: 1.1; }

  /* ── EMPTY / ERROR ── */
  .empty-state, .error-state {
    text-align: center; color: var(--text-dim);
    padding: 3rem 1rem; font-size: 0.95rem;
  }
  .error-state { color: var(--red); }

  footer {
    text-align: center; color: var(--text-dim);
    font-size: 0.7rem; padding: 1rem; font-family: var(--mono);
  }

  /* ── LANDSCAPE ── */
  @media (orientation: landscape) {
    header { padding: 0.5rem 1rem; }
    h1 { font-size: 1.05rem; }
    main { padding: 0.5rem 1rem 1.5rem; }
    .leg .flight { font-size: 1.25rem; }
    .leg .times  { font-size: 1rem; }
    .leg .city   { font-size: 0.9rem; }
    .row { padding: 0.7rem 1rem; margin-bottom: 0.45rem; }
  }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <h1>PPP <span class="code">Flights</span></h1>
    <div class="controls">
      <button class="btn" id="toggleBtn" title="Toggle: show all or only selected flights">All flights</button>
      <button class="btn refresh-btn" id="refreshBtn" aria-label="Refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M21 12a9 9 0 1 1-3-6.7M21 3v6h-6"/>
        </svg>
        Refresh
      </button>
    </div>
  </div>
  <div class="meta" id="metaLine">Loading…</div>
</header>

<div class="legend">
  <span><span class="dot teal"></span> On time</span>
  <span><span class="dot amber"></span> Delayed</span>
  <span><span class="dot red"></span> Tight turnaround</span>
  <span style="color:var(--text-dim)">· Tap a flight to select/deselect</span>
</div>

<main>
  <div id="rows"></div>
</main>

<footer>Whitsunday Coast Airport · CreativeTen FIDS · auto-refreshes every 60s</footer>

<script>
// ── Constants ──────────────────────────────────────────────────────────────
const DATA_URL   = 'data.json';
const REFRESH_MS = 60000;
const TL_START   = 9;    // timeline 09:00
const TL_END     = 18;   // timeline 18:00

// ── State ──────────────────────────────────────────────────────────────────
let allPairs    = [];
let selected    = new Set();   // flight keys (e.g. "JQ832") the user has tapped
let showAll     = true;        // true = show all; false = show only selected

// ── DOM refs ───────────────────────────────────────────────────────────────
const rowsEl      = document.getElementById('rows');
const metaEl      = document.getElementById('metaLine');
const refreshBtn  = document.getElementById('refreshBtn');
const toggleBtn   = document.getElementById('toggleBtn');

// ── Helpers ────────────────────────────────────────────────────────────────
function fmtTime(t) { return t || '—'; }

function timeToFrac(t) {
  // Convert "HH:MM" to fraction of [TL_START, TL_END]
  if (!t) return null;
  const [h, m] = t.split(':').map(Number);
  const total = h + m / 60;
  return Math.min(1, Math.max(0, (total - TL_START) / (TL_END - TL_START)));
}

function pairKey(pair) {
  const a = pair.arrival   ? pair.arrival.flight   : null;
  const d = pair.departure ? pair.departure.flight : null;
  return a || d;
}

function isMorning(pair) {
  // Morning = arrival ETA (or departure STD) before 13:00
  const t = (pair.arrival && pair.arrival.eta)      ? pair.arrival.eta
           : (pair.departure && pair.departure.std) ? pair.departure.std : null;
  if (!t) return false;
  const [h] = t.split(':').map(Number);
  return h < 13;
}

// ── Leg HTML ───────────────────────────────────────────────────────────────
function legHTML(kind, leg) {
  if (!leg) {
    return `<div class="leg ${kind}">
      <div class="place">—</div>
      <div class="flight" style="font-size:1.1rem;color:var(--text-dim)">No ${kind}</div>
    </div>`;
  }
  const place = kind === 'arrival' ? leg.origin : leg.destination;
  const sched = kind === 'arrival' ? leg.sta    : leg.std;
  const est   = kind === 'arrival' ? leg.eta    : leg.etd;
  const changed  = sched && est && sched !== est;
  const estClass = leg.delayed ? 'delayed' : 'ontime';

  // ETA/ETD slippage detected by comparing against previous fetch
  const slipped   = kind === 'arrival' ? leg.eta_slipped  : leg.etd_slipped;
  const slipMin   = slipped ? slipped.slip_min : 0;
  const prevTime  = slipped ? (kind === 'arrival' ? slipped.prev_eta : slipped.prev_etd) : null;
  const slipLabel = slipped
    ? (slipMin > 0
        ? `+${slipMin}min vs last check`
        : `${slipMin}min vs last check`)
    : null;

  let pill = '';
  if (leg.status) {
    const isLanded = /landed/i.test(leg.status);
    pill = `<div class="status-pill ${isLanded ? 'landed' : 'delayed'}">${leg.status}</div>`;
  }

  // Slippage pill — shown in addition to (or instead of) the status pill
  let slipPill = '';
  if (slipLabel && !leg.status) {
    slipPill = `<div class="status-pill delayed">${slipLabel}</div>`;
  } else if (slipLabel) {
    slipPill = `<div class="status-pill delayed" style="margin-left:4px">${slipLabel}</div>`;
  }

  return `<div class="leg ${kind}">
    <div class="place">${kind === 'arrival' ? '← Arrival' : 'Departure →'}</div>
    <div class="flight">${leg.flight}</div>
    <div class="times">
      ${prevTime && !changed ? `<span class="sched struck">${fmtTime(prevTime)}</span>` : ''}
      ${changed ? `<span class="sched struck">${fmtTime(sched)}</span>` : ''}
      <span class="est ${leg.delayed ? 'delayed' : (changed ? estClass : '')}">${fmtTime(est || sched)}</span>
    </div>
    <div class="city">${place || ''}</div>
    <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:${pill||slipPill?'4px':'0'}">
      ${pill}${slipPill}
    </div>
  </div>`;
}

// ── Connector ──────────────────────────────────────────────────────────────
function connectorHTML(pair) {
  const arrow = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 12h13"/><path d="M13 6l7 6-7 6"/></svg>`;
  const risk = pair.at_risk ? '<div class="risk-label">tight<br>turnaround</div>' : '';
  return `<div class="connector">${arrow}${risk}</div>`;
}

// ── Timeline bar ───────────────────────────────────────────────────────────
function buildTimeline(pairs) {
  const hours = [];
  for (let h = TL_START; h <= TL_END; h++) hours.push(h);

  const ticks = hours.map(h => {
    const pct = ((h - TL_START) / (TL_END - TL_START) * 100).toFixed(2);
    return `<div class="tick" style="left:${pct}%"></div>
            <div class="tick-label" style="left:${pct}%">${h}:00</div>`;
  }).join('');

  const pips = pairs.map(pair => {
    const key = pairKey(pair);
    const isHidden = !showAll && selected.size > 0 && !selected.has(key);
    const arrT  = pair.arrival   ? (pair.arrival.eta   || pair.arrival.sta)   : null;
    const depT  = pair.departure ? (pair.departure.etd || pair.departure.std) : null;

    let html = '';
    if (arrT) {
      const frac = timeToFrac(arrT);
      if (frac !== null) {
        html += `<div class="bar-pip arr ${isHidden ? 'hidden-flight' : ''} ${pair.at_risk ? 'at-risk' : ''}"
          style="left:${(frac*100).toFixed(2)}%"
          title="${key} arrival ${arrT}"></div>`;
      }
    }
    if (depT) {
      const frac = timeToFrac(depT);
      if (frac !== null) {
        html += `<div class="bar-pip dep ${isHidden ? 'hidden-flight' : ''} ${pair.at_risk ? 'at-risk' : ''}"
          style="left:${(frac*100).toFixed(2)}%"
          title="${key} departure ${depT}"></div>`;
      }
    }
    return html;
  }).join('');

  return `<div class="timeline-wrap">
    <div class="timeline-bar">${ticks}${pips}</div>
  </div>`;
}

// ── Main render ────────────────────────────────────────────────────────────
function render() {
  if (!allPairs.length) {
    rowsEl.innerHTML = `<div class="empty-state">No flights yet — check back shortly or trigger a manual GitHub Actions run.</div>`;
    return;
  }

  const morning   = allPairs.filter(p => isMorning(p));
  const afternoon = allPairs.filter(p => !isMorning(p));

  function rowHTML(pair) {
    const key      = pairKey(pair);
    const isSel    = selected.has(key);
    const isHidden = !showAll && selected.size > 0 && !isSel;
    return `<div class="row ${pair.at_risk ? 'at-risk' : ''} ${isSel ? 'selected' : ''} ${isHidden ? 'hidden-flight' : ''}"
      data-key="${key}">
      ${legHTML('arrival', pair.arrival)}
      ${connectorHTML(pair)}
      ${legHTML('departure', pair.departure)}
    </div>`;
  }

  function sectionHTML(pairs, label) {
    if (!pairs.length) return '';
    // Hide the section divider entirely if all rows in it are hidden
    const allHidden = !showAll && selected.size > 0 &&
      pairs.every(p => !selected.has(pairKey(p)));
    if (allHidden) return '';
    return `<div class="section-divider">
        <div class="label">${label}</div>
        <div class="line"></div>
      </div>
      ${pairs.map(rowHTML).join('')}`;
  }

  rowsEl.innerHTML =
    buildTimeline(allPairs) +
    sectionHTML(morning,   'Morning') +
    sectionHTML(afternoon, 'Afternoon');

}

function updateToggleBtn() {
  if (selected.size === 0) {
    toggleBtn.textContent = 'All flights';
    toggleBtn.classList.remove('active');
    showAll = true;
  } else if (showAll) {
    toggleBtn.textContent = `Selected (${selected.size})`;
  } else {
    toggleBtn.textContent = `Showing ${selected.size} selected`;
    toggleBtn.classList.add('active');
  }
}

toggleBtn.addEventListener('click', () => {
  if (selected.size === 0) return;
  showAll = !showAll;
  updateToggleBtn();
  render();
});

// ── Data loading ───────────────────────────────────────────────────────────
async function load(isManual) {
  if (isManual) refreshBtn.classList.add('spinning');
  try {
    const res  = await fetch(DATA_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    allPairs   = data.pairs || [];
    render();
    if (data.generated_at) {
      const dt = new Date(data.generated_at);
      metaEl.textContent = 'Updated '
        + dt.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        + ' · '
        + dt.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'short' });
    } else {
      metaEl.textContent = 'Waiting for first scheduled update';
    }
  } catch (err) {
    rowsEl.innerHTML = `<div class="error-state">Couldn't load flight data (${err.message}).</div>`;
    metaEl.textContent = 'Update failed';
  } finally {
    if (isManual) setTimeout(() => refreshBtn.classList.remove('spinning'), 400);
  }
}

// Event delegation for row taps — survives innerHTML re-renders
rowsEl.addEventListener('click', (e) => {
  const row = e.target.closest('.row');
  if (!row || !row.dataset.key) return;
  const key = row.dataset.key;
  if (selected.has(key)) selected.delete(key);
  else selected.add(key);
  updateToggleBtn();
  render();
});

refreshBtn.addEventListener('click', () => load(true));
load(false);
setInterval(() => load(false), REFRESH_MS);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>

</body>
</html>
