<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#14181F" />
<title>PPP Flight Board</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  :root {
    --bg: #14181F;
    --surface: #1C222B;
    --surface-2: #232A35;
    --border: #2A313D;
    --text: #E7ECF2;
    --text-dim: #8B95A5;
    --teal: #3FBF9F;
    --amber: #F2A93B;
    --red: #E2584F;
    --cyan: #52C7E0;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    -webkit-tap-highlight-color: transparent;
  }

  body {
    min-height: 100vh;
    padding-bottom: 3rem;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 1rem 1.1rem 0.85rem;
  }

  .title-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.75rem;
  }

  h1 {
    margin: 0;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 0.01em;
  }

  h1 .code {
    font-family: var(--mono);
    color: var(--cyan);
  }

  .refresh-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 0.4rem 0.7rem;
    font-size: 0.85rem;
    font-family: var(--sans);
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .refresh-btn:active { background: var(--surface-2); }

  .refresh-btn svg {
    width: 14px;
    height: 14px;
    transition: transform 0.5s ease;
  }

  .refresh-btn.spinning svg { animation: spin 0.7s linear infinite; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .meta {
    margin-top: 0.35rem;
    font-size: 0.78rem;
    color: var(--text-dim);
    font-family: var(--mono);
  }

  main { padding: 0.9rem 1.1rem 1.5rem; }

  .legend {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    font-size: 0.72rem;
    color: var(--text-dim);
    margin-bottom: 0.9rem;
  }

  .legend span { display: flex; align-items: center; gap: 0.35rem; }

  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.teal { background: var(--teal); }
  .dot.amber { background: var(--amber); }
  .dot.red { background: var(--red); }

  .row {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 0.65rem;
    padding: 0.85rem 0.9rem;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 0.6rem;
  }

  .row.at-risk {
    border-color: rgba(226, 88, 79, 0.55);
    background: linear-gradient(180deg, rgba(226, 88, 79, 0.08), var(--surface) 40%);
  }

  .leg { min-width: 0; }
  .leg.departure { text-align: right; }

  .leg .place {
    font-size: 0.72rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .leg .flight {
    font-family: var(--mono);
    font-size: 0.95rem;
    color: var(--cyan);
    font-weight: 600;
    margin: 0.15rem 0;
  }

  .leg .times {
    font-family: var(--mono);
    font-size: 0.85rem;
    color: var(--text);
    display: flex;
    gap: 0.4rem;
    align-items: baseline;
  }

  .leg.departure .times { justify-content: flex-end; }

  .times .sched {
    color: var(--text-dim);
    text-decoration: none;
  }

  .times .sched.struck {
    text-decoration: line-through;
    color: var(--text-dim);
  }

  .times .est.delayed { color: var(--amber); font-weight: 600; }
  .times .est.ontime { color: var(--teal); }

  .status-pill {
    display: inline-block;
    margin-top: 0.3rem;
    font-size: 0.68rem;
    padding: 0.12rem 0.45rem;
    border-radius: 5px;
    font-family: var(--sans);
  }

  .status-pill.delayed { background: rgba(242, 169, 59, 0.15); color: var(--amber); }
  .status-pill.landed { background: rgba(63, 191, 159, 0.15); color: var(--teal); }

  .connector {
    display: flex;
    flex-direction: column;
    align-items: center;
    color: var(--text-dim);
    min-width: 34px;
  }

  .connector svg { width: 20px; height: 20px; }
  .row.at-risk .connector { color: var(--red); }
  .row.at-risk .connector svg { filter: drop-shadow(0 0 4px rgba(226,88,79,0.5)); }

  .connector .risk-label {
    font-size: 0.6rem;
    color: var(--red);
    margin-top: 0.15rem;
    text-align: center;
    line-height: 1.1;
  }

  .empty-state, .error-state {
    text-align: center;
    color: var(--text-dim);
    padding: 3rem 1rem;
    font-size: 0.9rem;
  }

  .error-state { color: var(--red); }

  footer {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.7rem;
    padding: 1rem;
    font-family: var(--mono);
  }
</style>
</head>
<body>

<header>
  <div class="title-row">
    <h1>PPP <span class="code">Flight Board</span></h1>
    <button class="refresh-btn" id="refreshBtn" aria-label="Refresh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M21 12a9 9 0 1 1-3-6.7M21 3v6h-6"/>
      </svg>
      Refresh
    </button>
  </div>
  <div class="meta" id="metaLine">Loading…</div>
</header>

<main>
  <div class="legend">
    <span><span class="dot teal"></span> On time</span>
    <span><span class="dot amber"></span> Delayed</span>
    <span><span class="dot red"></span> Tight turnaround</span>
  </div>
  <div id="rows"></div>
</main>

<footer>Whitsunday Coast Airport · data via CreativeTen FIDS</footer>

<script>
const DATA_URL = 'data.json';
const REFRESH_MS = 60000;

const rowsEl = document.getElementById('rows');
const metaEl = document.getElementById('metaLine');
const refreshBtn = document.getElementById('refreshBtn');

function fmtTime(t) {
  return t || '—';
}

function legHTML(kind, leg) {
  if (!leg) {
    return `<div class="leg ${kind}"><div class="place">—</div><div class="flight">No linked ${kind === 'arrival' ? 'arrival' : 'departure'}</div></div>`;
  }
  const place = kind === 'arrival' ? leg.origin : leg.destination;
  const schedTime = kind === 'arrival' ? leg.sta : leg.std;
  const estTime = kind === 'arrival' ? leg.eta : leg.etd;
  const changed = schedTime && estTime && schedTime !== estTime;
  const estClass = leg.delayed ? 'delayed' : 'ontime';

  let statusPill = '';
  if (leg.status) {
    const isLanded = /landed/i.test(leg.status);
    statusPill = `<div class="status-pill ${isLanded ? 'landed' : 'delayed'}">${leg.status}</div>`;
  }

  return `
    <div class="leg ${kind}">
      <div class="place">${place || ''}</div>
      <div class="flight">${leg.flight}</div>
      <div class="times">
        ${changed ? `<span class="sched struck">${fmtTime(schedTime)}</span>` : ''}
        <span class="est ${changed ? estClass : ''}">${fmtTime(estTime || schedTime)}</span>
      </div>
      ${statusPill}
    </div>
  `;
}

function connectorHTML(pair) {
  const arrow = `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 12h13"/><path d="M13 6l7 6-7 6"/>
    </svg>
  `;
  const label = pair.at_risk ? '<div class="risk-label">tight<br/>turnaround</div>' : '';
  return `<div class="connector">${arrow}${label}</div>`;
}

function render(data) {
  if (!data.pairs || data.pairs.length === 0) {
    rowsEl.innerHTML = `<div class="empty-state">No flights loaded yet for today. If this persists past the next scheduled update, check the GitHub Action logs.</div>`;
    return;
  }

  rowsEl.innerHTML = data.pairs.map(pair => `
    <div class="row ${pair.at_risk ? 'at-risk' : ''}">
      ${legHTML('arrival', pair.arrival)}
      ${connectorHTML(pair)}
      ${legHTML('departure', pair.departure)}
    </div>
  `).join('');
}

async function load(isManual) {
  if (isManual) refreshBtn.classList.add('spinning');
  try {
    const res = await fetch(DATA_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    render(data);
    if (data.generated_at) {
      const dt = new Date(data.generated_at);
      metaEl.textContent = 'Updated ' + dt.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) +
        ' · ' + dt.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'short' });
    } else {
      metaEl.textContent = 'Waiting for first scheduled update';
    }
  } catch (err) {
    rowsEl.innerHTML = `<div class="error-state">Couldn't load flight data (${err.message}). Pull to refresh or check your connection.</div>`;
    metaEl.textContent = 'Update failed';
  } finally {
    if (isManual) setTimeout(() => refreshBtn.classList.remove('spinning'), 400);
  }
}

refreshBtn.addEventListener('click', () => load(true));
load(false);
setInterval(() => load(false), REFRESH_MS);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>

</body>
</html>
